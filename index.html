<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人自我介紹</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #fff;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #4f46e5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        section {
            padding: 30px;
            border-bottom: 1px solid #eee;
        }

        section:last-child {
            border-bottom: none;
        }

        h2 {
            color: #4f46e5;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
        }

        .skills-list li {
            background: #eef2ff;
            color: #4338ca;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .social-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .social-links a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .social-links a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #fafafa;
            color: #777;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頭部個人資訊 -->
        <header>
            <div class="avatar">👨‍💻</div>
            <h1>葉彥廷(Ray)</h1>
            <p>職稱 / 現職角色（如：前端工程師 / 產品設計師）</p>
        </header>

        <!-- 個人簡介 -->
        <section>
            <h2>關於我</h2>
            <p>熱愛學習與分享，擁有 X 年的相關領域經驗。擅長解決問題、優化流程，並持續探索新技術與創意思維。休閒時間喜歡玩手機和電腦遊戲、騎車與看棒球啦啦隊。</p>
        </section>

        <!-- 專業技能 -->
        <section>
            <h2>專業技能</h2>
            <ul class="skills-list">
                <li>後端程式 Java/C#/C++/Python</li>
                <li>專案管理</li>
                <li>問題解決能力</li>
                <li>團隊協作</li>
                <li>AI人工智慧</li>
            </ul>
        </section>

        <!-- 聯絡方式 / 社群連結 -->
        <section>
            <h2>社群與聯絡</h2>
            <ul class="social-links">
                <li><a href="https://mail.google.com/mail/u/0/?tab=rm&ogbl#inbox">Email</a></li>
                <li><a href="https://github.com" target="_blank">GitHub</a></li>
                <li><a href="https://linkedin.com" target="_blank">LinkedIn</a></li>
            </ul>
        </section>

        <!-- 頁尾 -->
        <footer>
            &copy; 2026 Your Name. All rights reserved.
        </footer>
    </div>

</body>
</html>
